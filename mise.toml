[tools]
go = "1.27.4"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.fmt]
description = "Format Go source"
run = "gofmt -w ."

[tasks.fmt-check]
description = "Check Go formatting"
run = '''
unformatted="$(gofmt -l .)"
if [ -n "$unformatted" ]; then
  printf 'Go files need formatting:\n%s\n' "$unformatted"
  exit 1
fi
'''

[tasks.test]
description = "Run race-enabled unit tests"
run = "go test -race ./..."

[tasks.workflow-check]
description = "Validate GitHub Actions workflows"
run = "actionlint .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/pr-agent.yml"

[tasks.vet]
description = "Check Go code with vet"
run = "go vet ./..."

[tasks.mod-check]
description = "Verify downloaded module contents"
run = "go mod verify"

[tasks.qualification-runner-check]
description = "Check qualification runner input validation and cleanup"
run = "python3 -B -m unittest discover -s scripts/host-qualification -p '*_test.py'"

[tasks.build]
description = "Build the Navidrome WebAssembly plugin"
# TinyGo 0.40.1 panics in the PDK's JSON decoder before the provider is called.
run = "mkdir -p dist && GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o dist/plugin.wasm ./plugin"

[tasks.package]
description = "Package the Navidrome plugin"
depends = ["build"]
run = "zip -q -j -FS dist/nd-better-lyrics.ndp dist/plugin.wasm plugin/manifest.json"

[tasks.package-check]
description = "Validate the plugin package contents"
depends = ["package"]
run = '''
unzip -t dist/nd-better-lyrics.ndp
entries="$(unzip -Z1 dist/nd-better-lyrics.ndp | LC_ALL=C sort)"
expected="$(printf 'manifest.json\nplugin.wasm')"
if [ "$entries" != "$expected" ]; then
  printf 'Unexpected package contents:\n%s\n' "$entries"
  exit 1
fi
'''

[tasks.check]
description = "Run all checks and build the package"
run = '''
mise run fmt-check
mise run workflow-check
mise run vet
mise run mod-check
mise run test
mise run qualification-runner-check
mise run package-check
'''
