name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false

      - name: Verify tag matches the plugin version
        if: github.ref_type == 'tag'
        run: |
          expected="v$(jq -r .version plugin/manifest.json)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            printf 'Tag %s does not match plugin version %s\n' "$GITHUB_REF_NAME" "$expected"
            exit 1
          fi
          printf 'Releasing plugin version %s\n' "$(jq -r .version plugin/manifest.json)"

      - name: Run checks and package the plugin
        run: mise run check

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/nd-better-lyrics.ndp \
            --title "nd-better-lyrics $GITHUB_REF_NAME" \
            --generate-notes
