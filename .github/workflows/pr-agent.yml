name: Optional PR-Agent review
run-name: 'PR-Agent #${{ github.event.pull_request.number || github.event.issue.number }}'

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event_name == 'issue_comment' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ranokay/agent-workflows/.github/workflows/pr-agent.yml@6ad88182eed9dbc5a12024861e3fd2214d18ea12
    with:
      context-files: '["docs/agents/pr-review.md","docs/current-state.md","README.md"]'
    secrets:
      opencode-key: ${{ secrets.PR_AGENT_OPENCODE_KEY }}
