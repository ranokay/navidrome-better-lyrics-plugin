name: Optional PR-Agent review
run-name: 'PR-Agent #${{ github.event.pull_request.number || github.event.issue.number }}'

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event.sender.type != 'Bot' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.type != 'Bot' &&
        !github.event.pull_request.draft) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.issue.state == 'open' &&
        (github.event.comment.body == '/review' ||
         startsWith(github.event.comment.body, '/review ') ||
         github.event.comment.body == '/improve' ||
         startsWith(github.event.comment.body, '/improve ') ||
         startsWith(github.event.comment.body, '/ask '))))
    uses: ranokay/agent-workflows/.github/workflows/pr-agent.yml@d043a48972b66ca7f4de448ab7cdda263bbf7f50
    with:
      context-files: '["docs/agents/pr-review.md","docs/current-state.md","README.md"]'
    secrets:
      opencode-key: ${{ secrets.PR_AGENT_OPENCODE_KEY }}
