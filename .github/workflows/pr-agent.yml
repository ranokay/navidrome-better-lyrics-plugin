name: PR-Agent review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check whether the trial is configured
        id: configuration
        env:
          OPENCODE_KEY: ${{ secrets.PR_AGENT_OPENCODE_KEY }}
        run: |
          if [ -n "$OPENCODE_KEY" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::PR-Agent is disabled until PR_AGENT_OPENCODE_KEY is configured.'
          fi

      - name: Review the pull request
        if: steps.configuration.outputs.configured == 'true'
        uses: docker://pragent/pr-agent@sha256:3121a7b8e3ab497b4df09dea6a444da8f01a474496c8c2f722828512c52fd266 # 0.41.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI__KEY: ${{ secrets.PR_AGENT_OPENCODE_KEY }}
          OPENAI__API_BASE: https://opencode.ai/zen/go/v1
          LITELLM.EXTRA_HEADERS: '{"x-opencode-session":"pr-agent-${{ github.run_id }}-${{ github.run_attempt }}","user-agent":"pr-agent-github-actions/0.41.0"}'
          config.model: openai/deepseek-v4.1-flash
          config.custom_model_max_tokens: '32000'
          config.fallback_models: '[]'
          config.propagate_tool_errors: 'true'
          github_action_config.auto_review: 'true'
          github_action_config.auto_describe: 'false'
          github_action_config.auto_improve: 'false'
