name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Run checks
        run: mise run check

      - name: Upload plugin package
        uses: actions/upload-artifact@v7
        with:
          name: better-lyrics
          path: dist/better-lyrics.ndp
          if-no-files-found: error
